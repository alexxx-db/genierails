name: GenieRails prod maintain (aws)

# Stage 5, "Keep protected", of shared/docs/pipelines.md: on a schedule. Copy to
# .github/workflows/ at the repository root.
#
#   make maintain ENV=prod     at the last released commit
#
# REQUIRES PROD REMOTE STATE (deferred; design section 15). The release
# receipt names the last released commit; until prod has remote state, the
# operator runs make maintain ENV=prod on the deployment machine, on its own
# schedule, at that commit, in the same persistent checkout as releases
# (`git fetch && git checkout --force --detach <sha>`, an empty
# `git status --porcelain`, never `git clean -x` or a re-clone; see
# prod-release.yml). The CI guard refuses every applying target here. Do not
# set GENIERAILS_ALLOW_CI_APPLY.
#
# Auth: OIDC workload identity federation, no PATs or secrets. The job runs
# in the "production-maintain" environment (deploys only from main, no
# reviewer, so the schedule isn't held for approval): the prod read-only
# service principal trusts its OIDC subject. The environment holds no
# variables. That SP also needs CAN_USE on a SQL warehouse.
# Repository variables (IDs, not credentials):
#   DATABRICKS_ACCOUNT_ID  PROD_READONLY_CLIENT_ID
#   PROD_DATABRICKS_WORKSPACE_ID  PROD_DATABRICKS_WORKSPACE_HOST

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Its own group, never shared with the release workflow: GitHub keeps only
# one pending run per group, so a shared group let a scheduled maintain
# cancel a pending release and a release waiting days for approval hold
# maintain back. Pending maintain runs queue behind the same group; a running
# one is never cancelled. Release and maintain must never apply to prod at the
# same time; on the deployment machine the GenieRails env lock serialises them.
concurrency:
  group: genierails-prod-maintain-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: aws

jobs:
  maintain:
    name: Maintain (requires prod remote state)
    runs-on: ubuntu-latest
    environment: production-maintain
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the last released commit
        run: |
          released_commit="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str((Path.cwd() / "../shared/scripts").resolve()))
          import release_gate
          receipt = release_gate.last_release(Path.cwd(), "prod")
          if not receipt or not receipt.get("commit"):
              raise SystemExit("no prod release receipt found; release prod before running maintain")
          print(receipt["commit"])
          PY
          )"
          git fetch --no-tags origin "$released_commit"
          git checkout --force --detach "$released_commit"
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install 'python-hcl2>=7.3.1,<8' 'databricks-sdk==0.150.0'

      - name: Write OIDC auth file (IDs only, no secrets)
        env:
          ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          CLIENT_ID: ${{ vars.PROD_READONLY_CLIENT_ID }}
          WORKSPACE_ID: ${{ vars.PROD_DATABRICKS_WORKSPACE_ID }}
          HOST: ${{ vars.PROD_DATABRICKS_WORKSPACE_HOST }}
        run: |
          mkdir -p envs/prod
          printf '%s\n' \
            "databricks_account_id     = \"$ACCOUNT_ID\"" \
            "databricks_client_id      = \"$CLIENT_ID\"" \
            'databricks_client_secret  = ""' \
            "databricks_workspace_id   = \"$WORKSPACE_ID\"" \
            "databricks_workspace_host = \"$HOST\"" > envs/prod/auth.auto.tfvars

      - name: make maintain ENV=prod
        run: make maintain ENV=prod
