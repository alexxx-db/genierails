name: GenieRails PR check (aws)

# Stage 2, "PR check", of shared/docs/pipelines.md: read-only, on every pull request.
# Copy this file to .github/workflows/ at the repository root. On main, make
# this job a required status check and require branches to be up to date
# before merging; "Require branches to be up to date" or a merge queue is the
# stronger repository-level guarantee. The push job below uses the repository
# GITHUB_TOKEN to re-run this workflow for every open PR head whenever main
# moves, and the check job explicitly merges the PR head with freshly fetched
# origin/main before running make check.
#
#   make check ENV=dev                 always
#   make check ENV=prod                also, when the PR touches envs/prod/** or
#                                      shared/** (the prod release counts both; it
#                                      includes make promote-to ENV=prod CHECK=1)
#
# make check never writes envs/ and runs no applying target, so it is safe
# under CI=true and never trips the CI apply guard. Until an env has remote
# state, its plan is a STRUCTURAL plan: the committed config against empty
# state.
#
# Auth: OIDC workload identity federation; no PATs and no client secrets.
# Give each read-only service principal a federation policy for this
# repository (issuer https://token.actions.githubusercontent.com), then set
# these repository variables (IDs, not credentials):
#   DATABRICKS_ACCOUNT_ID
#   DEV_READONLY_CLIENT_ID   DEV_DATABRICKS_WORKSPACE_ID   DEV_DATABRICKS_WORKSPACE_HOST
#   PROD_READONLY_CLIENT_ID  PROD_DATABRICKS_WORKSPACE_ID  PROD_DATABRICKS_WORKSPACE_HOST
# Read-only SPs need USE CATALOG, USE SCHEMA, BROWSE, read on
# system.information_schema and CAN_VIEW on the agents. The Databricks
# Terraform provider and SDK must support the github-oidc auth type. Pull
# requests from forks get no OIDC token; their plan step fails.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: aws

jobs:
  rerun-open-pr-checks:
    name: Re-run open PR checks after main moves
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run this workflow for open PR heads
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --paginate --jq '.[] | [.number, .head.sha] | @tsv')" || exit $?
          if [ -z "$prs" ]; then
            echo "No open PRs targeting main."
            exit 0
          fi
          while IFS=$'\t' read -r number sha; do
            [ -n "$number" ] || continue
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pr-check.yml/runs?event=pull_request&head_sha=${sha}&per_page=1" \
              --jq '.workflow_runs[0].id // empty')" || exit $?
            if [ -z "$run_id" ]; then
              echo "::notice::PR #${number} has no prior pr-check run to re-run."
              continue
            fi
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun" >/dev/null; then
              echo "Re-ran pr-check for PR #${number} (${sha})."
            else
              echo "::warning::could not re-run pr-check for PR #${number} (${sha}); it may still be running or too old to re-run."
            fi
          done <<EOF
          $prs
          EOF

  check:
    name: make check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test PR head merged with current main
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin main
          git fetch --no-tags origin "$HEAD_SHA" || git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          git checkout --force --detach "$HEAD_SHA"
          if ! git merge --no-edit --no-ff origin/main; then
            echo "::error::PR head $HEAD_SHA does not merge cleanly with current origin/main; rebase or merge main and re-run checks."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install 'python-hcl2>=7.3.1,<8' 'databricks-sdk==0.150.0' pytest

      # Pinned by commit (v3.1.2), with the Terraform the repository's CI tests.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Does this PR touch envs/prod or shared?
        id: scope
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- envs/prod ../shared | grep -q .; then
            echo "prod=true" >> "$GITHUB_OUTPUT"
          fi

      # Runtime files only (gitignored). make check copies them into its
      # scratch dir for the plan step and never writes back to envs/.
      - name: Write OIDC auth files (IDs only, no secrets)
        env:
          ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          DEV_CLIENT_ID: ${{ vars.DEV_READONLY_CLIENT_ID }}
          DEV_WORKSPACE_ID: ${{ vars.DEV_DATABRICKS_WORKSPACE_ID }}
          DEV_HOST: ${{ vars.DEV_DATABRICKS_WORKSPACE_HOST }}
          PROD_CLIENT_ID: ${{ vars.PROD_READONLY_CLIENT_ID }}
          PROD_WORKSPACE_ID: ${{ vars.PROD_DATABRICKS_WORKSPACE_ID }}
          PROD_HOST: ${{ vars.PROD_DATABRICKS_WORKSPACE_HOST }}
        run: |
          write_auth() {
            mkdir -p "envs/$1"
            printf '%s\n' \
              "databricks_account_id     = \"$ACCOUNT_ID\"" \
              "databricks_client_id      = \"$2\"" \
              'databricks_client_secret  = ""' \
              "databricks_workspace_id   = \"$3\"" \
              "databricks_workspace_host = \"$4\"" > "envs/$1/auth.auto.tfvars"
          }
          write_auth dev "$DEV_CLIENT_ID" "$DEV_WORKSPACE_ID" "$DEV_HOST"
          write_auth prod "$PROD_CLIENT_ID" "$PROD_WORKSPACE_ID" "$PROD_HOST"

      - name: make check ENV=dev
        run: make check ENV=dev

      - name: make check ENV=prod
        if: steps.scope.outputs.prod == 'true'
        run: make check ENV=prod
