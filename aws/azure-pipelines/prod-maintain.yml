# GenieRails prod maintain (aws), Azure DevOps.
#
# Stage 5, "Keep protected", of shared/docs/pipelines.md: on a schedule.
#
#   make maintain ENV=prod     at the last released commit
#
# REQUIRES PROD REMOTE STATE (deferred; design section 15). The release
# receipt names the last released commit; until prod has remote state, the
# operator runs make maintain ENV=prod on the deployment machine, on its own
# schedule, at that commit, in the same persistent checkout as releases
# (`git fetch && git checkout --force --detach <sha>`, an empty
# `git status --porcelain`, never `git clean -x` or a re-clone; see
# prod-release.yml). The CI guard refuses every applying target here
# (TF_BUILD is set). Do not set GENIERAILS_ALLOW_CI_APPLY.
#
# It uses no environment, so it never takes or waits for the release
# pipeline's Exclusive Lock on "genierails-prod", and a release waiting
# for approval cannot hold it back. Release and maintain must never apply
# to prod at the same time; on the deployment machine the GenieRails env
# lock serialises them.
#
# Auth: OIDC workload identity federation (azure-devops-oidc), no PATs or
# secrets. Variable group "genierails-ids" holds the prod read-only SP's IDs;
# that SP also needs CAN_USE on a SQL warehouse:
#   DATABRICKS_ACCOUNT_ID  PROD_READONLY_CLIENT_ID
#   PROD_DATABRICKS_WORKSPACE_ID  PROD_DATABRICKS_WORKSPACE_HOST

trigger: none
pr: none

schedules:
  - cron: '0 3 * * *'
    displayName: Daily maintain
    branches:
      include: [main]
    always: true

variables:
  - group: genierails-ids

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0

  - script: |
      released_commit="$(python3 - <<'PY'
      import sys
      from pathlib import Path
      sys.path.insert(0, str((Path.cwd() / "../shared/scripts").resolve()))
      import release_gate
      receipt = release_gate.last_release(Path.cwd(), "prod")
      if not receipt or not receipt.get("commit"):
          raise SystemExit("no prod release receipt found; release prod before running maintain")
      print(receipt["commit"])
      PY
      )"
      git fetch --no-tags origin "$released_commit"
      git checkout --force --detach "$released_commit"
      if [ -n "$(git status --porcelain)" ]; then
        git status --porcelain
        exit 1
      fi
    displayName: Check out the last released commit
    workingDirectory: aws

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - script: pip install 'python-hcl2>=7.3.1,<8' 'databricks-sdk==0.150.0'
    displayName: Install dependencies

  - script: |
      mkdir -p envs/prod
      printf '%s\n' \
        "databricks_account_id     = \"$ACCOUNT_ID\"" \
        "databricks_client_id      = \"$CLIENT_ID\"" \
        'databricks_client_secret  = ""' \
        "databricks_workspace_id   = \"$WORKSPACE_ID\"" \
        "databricks_workspace_host = \"$HOST\"" > envs/prod/auth.auto.tfvars
    displayName: Write OIDC auth file (IDs only, no secrets)
    workingDirectory: aws
    env:
      ACCOUNT_ID: $(DATABRICKS_ACCOUNT_ID)
      CLIENT_ID: $(PROD_READONLY_CLIENT_ID)
      WORKSPACE_ID: $(PROD_DATABRICKS_WORKSPACE_ID)
      HOST: $(PROD_DATABRICKS_WORKSPACE_HOST)

  - script: make maintain ENV=prod
    displayName: make maintain ENV=prod
    workingDirectory: aws
    env:
      DATABRICKS_AUTH_TYPE: azure-devops-oidc
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
